name: Validation

on:
  pull_request:
  push:
    branches:
      - develop
      - pre-release

permissions:
  contents: read

jobs:
  validate:
    name: Full validation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts --allow-remote=all

      - name: Prepare local CLI shim
        run: node scripts/install-task-runner-shim.ts

      - name: Run validation gate
        run: npm run validate
